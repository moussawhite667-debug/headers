<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<style id="css">
:root{
  --bg:#F4F5F8;--surface:#FFFFFF;--ink:#141833;--ink2:#4E5370;--line:#DDE0EB;
  --brand:#1A1F4A;--brand-ink:#F4F5F8;--gold:#A8853D;--sale:#C23A3A;--ok:#177245;--wa:#15803F;
  --hero:#1A1F4A;--hero-ink:#F4F5F8;--hero-gold:#D2B26A;--field:#FFFFFF;
  --shadow:0 10px 40px rgba(20,24,51,.22);
  --serif:'Marcellus','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1122;--surface:#171B33;--ink:#ECEEF7;--ink2:#A9AEC9;--line:#2B3052;
    --brand:#E4E6F6;--brand-ink:#141833;--gold:#D2B26A;--hero:#1B2158;--field:#10142A;
    --shadow:0 10px 40px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1122;--surface:#171B33;--ink:#ECEEF7;--ink2:#A9AEC9;--line:#2B3052;
  --brand:#E4E6F6;--brand-ink:#141833;--gold:#D2B26A;--hero:#1B2158;--field:#10142A;
  --shadow:0 10px 40px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ic{flex:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

.topbar{background:var(--brand);color:var(--brand-ink);text-align:center;font-size:13px;padding:8px 16px}
.setup{background:#FFF1C2;color:#4d3a00;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 16px;font-size:14px;text-align:center}

.hdr{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);cursor:pointer}
.logo svg{color:var(--gold)}
.lg-name{font-family:var(--serif);font-size:22px;letter-spacing:.2em}
.lg-sub{font-size:11px;letter-spacing:.32em;color:var(--ink2);font-weight:600;margin-top:4px}
.nav{display:none;gap:26px;margin-left:auto;font-size:15px}
.nav a{text-decoration:none;color:var(--ink2)}
.nav a:hover{color:var(--ink)}
.acts{display:flex;gap:4px;margin-left:auto}
@media(min-width:760px){.nav{display:flex}.acts{margin-left:0}}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:inherit}
.iconbtn:hover{background:var(--line)}
.iconbtn.danger:hover{color:var(--sale)}
.cartbtn{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.cartbtn:hover{background:var(--line)}
.count{position:absolute;top:3px;right:1px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--sale);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.count:empty{display:none}

.hero{background:var(--hero);color:var(--hero-ink);position:relative;overflow:hidden}
.hero-in{position:relative;z-index:1;padding-top:56px;padding-bottom:64px}
.hero h1{font:400 clamp(2.2rem,7vw,4.2rem)/1.05 var(--serif);margin:0 0 16px;max-width:15ch}
.hero p{max-width:46ch;margin:0 0 28px;font-size:17px;color:color-mix(in srgb,var(--hero-ink) 80%,transparent)}
.orn{position:absolute;right:-70px;bottom:-30px;width:min(95vw,640px);color:var(--hero-gold);opacity:.32;pointer-events:none}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;font-weight:600;font-size:15px;background:var(--brand);color:var(--brand-ink);text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.light{background:var(--hero-ink);color:#141833}
.btn.ghost{background:transparent;border:1.5px solid currentColor;color:var(--hero-ink)}
.btn.wa{background:var(--wa);color:#fff}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{min-height:38px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{text-decoration:underline;color:inherit;font-size:15px}

.sec{padding-top:44px;padding-bottom:24px}
#collection,#infos,#contact{scroll-margin-top:72px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.sec-h span{color:var(--ink2);font-size:14px}
h2{font:400 clamp(1.6rem,4vw,2.2rem)/1.15 var(--serif);margin:0}
.tools{display:flex;gap:10px;margin-bottom:12px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 16px;min-height:46px;color:var(--ink2)}
.search input{border:0;background:none;outline:0;width:100%;min-height:44px;color:var(--ink)}
.tools select{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:46px;max-width:44%}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px}
.chip[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}}
@media(min-width:1040px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card .ph{position:relative;aspect-ratio:4/5;background:var(--line)}
.card img{width:100%;height:100%;object-fit:cover}
.card.out img{filter:grayscale(1);opacity:.6}
.badge{position:absolute;left:10px;top:10px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--sale);color:#fff}
.badge.new{background:var(--brand);color:var(--brand-ink)}
.badge.out{background:var(--ink);color:var(--bg)}
.quick{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.meta{padding:12px 14px 16px}
.cat{font-size:13px;color:var(--ink2)}
.meta h3{font:600 15px/1.3 var(--sans);margin:2px 0 6px}
.price{margin:0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.price b{font-weight:700}
.price s{color:var(--ink2);font-size:13px}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--ink2)}

.infos{display:grid;gap:18px;padding-top:32px;padding-bottom:48px}
@media(min-width:760px){.infos{grid-template-columns:repeat(3,1fr);gap:28px}}
.info{display:flex;gap:14px}
.info .ico{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);flex:none}
.info h3{margin:0 0 2px;font:600 16px var(--sans)}
.info p{margin:0;color:var(--ink2);font-size:15px}

.ftr{background:var(--hero);color:var(--hero-ink);padding:44px 0 20px;margin-top:24px}
.ftr-in{display:grid;gap:28px}
@media(min-width:760px){.ftr-in{grid-template-columns:1.4fr 1fr 1fr}}
.ftr h4{margin:0 0 10px;font:600 15px var(--sans)}
.ftr a{color:inherit}
.ftr p{margin:4px 0;opacity:.85;font-size:15px}
.ftr .logo{color:var(--hero-ink)}
.ftr .logo svg{color:var(--hero-gold)}
.ftr .lg-sub{color:inherit;opacity:.75}
.copy{margin-top:28px;padding-top:16px;border-top:1px solid rgba(255,255,255,.18);font-size:13px;opacity:.7}

.fab{position:fixed;right:16px;bottom:76px;z-index:15;width:56px;height:56px;border-radius:50%;background:var(--wa);color:#fff;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}

#layer{position:relative;z-index:50}
.scrim{position:fixed;inset:0;background:rgba(10,12,28,.55);animation:fade .2s}
.sheet,.dialog{position:fixed;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);overflow:auto;animation:up .25s ease-out}
.sheet{left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.dialog{left:0;right:0;bottom:0;max-height:94vh;max-height:94dvh;border-radius:18px 18px 0 0}
@media(min-width:760px){
  .sheet{left:auto;top:0;bottom:0;width:440px;max-height:none;border-radius:0;animation:slide .25s ease-out}
  .dialog{left:50%;top:50%;bottom:auto;right:auto;width:min(880px,94vw);max-height:90vh;transform:translate(-50%,-50%);border-radius:16px;animation:fade .2s}
}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
@keyframes fade{from{opacity:0}}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 12px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.sh-head h2{font-size:22px}
.sh-body{padding:6px 18px 20px;overflow:auto;flex:1}
.line-i{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.line-i img{width:64px;height:80px;object-fit:cover;border-radius:8px}
.line-i h4{margin:0;font:600 15px/1.3 var(--sans)}
.line-i .r{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.qty button{width:38px;height:38px;display:grid;place-items:center}
.qty span{min-width:26px;text-align:center;font-weight:600}
.rm{color:var(--ink2);width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.rm:hover{color:var(--sale)}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:700;padding:16px 0 8px}
.fld{display:block;margin:12px 0}
.fld>span{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.fld input,.fld textarea,.fld select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
.fld small{display:block;color:var(--ink2);margin-top:4px;font-size:13px}
.note{color:var(--ink2);font-size:14px;margin:10px 0 0}

.pm{display:grid}
@media(min-width:760px){.pm{grid-template-columns:1fr 1fr}}
.gal{position:relative;background:var(--line)}
.gal img{width:100%;aspect-ratio:4/5;object-fit:cover}
.g-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.g-prev{left:10px}.g-next{right:10px}
.g-x{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.2)}
@media(min-width:760px){.g-x{display:none}}
@media(max-width:759px){.pm-in .x{display:none}}
.g-count{position:absolute;left:10px;bottom:10px;background:rgba(10,12,28,.7);color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.thumbs{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumb{flex:none;width:58px;height:72px;border-radius:8px;overflow:hidden;border:2px solid transparent;opacity:.65;background:var(--line)}
.thumb[aria-current=true]{border-color:var(--gold);opacity:1}
.thumb img{width:100%;height:100%;object-fit:cover}
.pm-in{padding:20px;position:relative}
.pm-in .x{position:absolute;right:8px;top:8px;background:var(--surface)}
.pm-in h2{margin:2px 0 8px;padding-right:40px;font-size:clamp(1.5rem,3.5vw,2rem)}
.big{font-size:22px}
.desc{white-space:pre-line;color:var(--ink2);margin:14px 0}
.stock{font-size:14px;font-weight:600;color:var(--ok);margin:0 0 6px}
.stock.no{color:var(--sale)}
.pm-act{display:grid;gap:10px;margin-top:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

#toast{position:fixed;left:50%;top:76px;transform:translate(-50%,-12px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:90;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

.adm{position:fixed;inset:0;background:var(--bg);overflow:auto;display:flex;flex-direction:column;animation:fade .2s}
.adm-top{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line)}
.adm-t1{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 4px 16px}
.adm-t1 h2{font-size:20px}
.tabs{display:flex;gap:2px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.tab{padding:12px 14px;font-weight:600;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--gold)}
.adm-body{padding:18px 16px 120px;max-width:760px;width:100%;margin:0 auto}
.a-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.a-head h2{font-size:22px}
.a-row{display:grid;grid-template-columns:56px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.a-row img{width:56px;height:70px;object-fit:cover;border-radius:8px}
.a-row .inf b{display:block;line-height:1.3}
.a-row .inf span{font-size:13px;color:var(--ink2)}
.a-btns{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.a-bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar-t{font-size:14px;color:var(--ink2)}
.bar-t.dirty{color:var(--sale);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:center;margin:10px 0;font-weight:500}
.check input{width:20px;height:20px}
.imgpick img{width:140px;height:175px;object-fit:cover;border-radius:10px;margin-bottom:8px;background:var(--line)}
.steps{margin:0 0 16px;padding-left:20px;color:var(--ink2)}
.steps li{margin:4px 0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.box h3{margin:0 0 6px;font:600 16px var(--sans)}
.box p{margin:0 0 10px;color:var(--ink2);font-size:15px}
.acts2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
textarea.cap{min-height:220px;line-height:1.5}

.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:560px){.pgrid{grid-template-columns:repeat(5,1fr)}}
.pth{position:relative;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--line)}
.pth img{width:100%;height:100%;object-fit:cover}
.pcov{position:absolute;left:4px;top:4px;background:var(--brand);color:var(--brand-ink);font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.pbt{position:absolute;right:4px;bottom:4px;display:flex;gap:4px}
.pmini{width:34px;height:34px;border-radius:50%;background:rgba(10,12,28,.75);color:#fff;display:grid;place-items:center}
.padd{position:relative;aspect-ratio:4/5;border:2px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink2);cursor:pointer;font-weight:600;font-size:13px;text-align:center}
.padd:focus-within{outline:2px solid var(--gold)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.legal{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px}
.legal .linkbtn{font-size:13px;text-align:left}
.pol h3{margin:20px 0 6px;font:600 16px var(--sans)}
.pol h3:first-child{margin-top:12px}
.pol p{margin:0 0 10px;color:var(--ink2);font-size:15px;line-height:1.55}
.polnav{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.polnav .linkbtn{font-size:14px;text-align:left}
</style>
</head>
<body>
<div id="app"></div>

function discount(p){return p.oldPrice&&p.oldPrice>p.price?Math.round((1-p.price/p.oldPrice)*100):0}

var tt;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},3200)}
function openExternal(url){
  var a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';
  document.body.appendChild(a);a.click();a.remove();
}
function openWA(text){
  var n=waNum();
  if(!n){toast(admin?'Ajoutez votre numéro WhatsApp dans Espace propriétaire > Réglages.':'La commande WhatsApp sera bientôt disponible.');return}
  var enc=encodeURIComponent(text), web='https://wa.me/'+n+'?text='+enc;
  var mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent||''), isTop=false;
  try{isTop=window.top===window.self}catch(e){}
  if(mobile&&isTop){
    var left=false, mark=function(){left=true};
    document.addEventListener('visibilitychange',mark);window.addEventListener('pagehide',mark);window.addEventListener('blur',mark);
    window.location.href='whatsapp://send?phone='+n+'&text='+enc;
    setTimeout(function(){
      document.removeEventListener('visibilitychange',mark);window.removeEventListener('pagehide',mark);window.removeEventListener('blur',mark);
      if(!left&&!document.hidden)window.location.href=web;
    },1600);
    return;
  }
  openExternal(web);
}

function list(){
  var a=S.products.slice();
  if(ui.cat!=='Tous')a=a.filter(function(p){return p.category===ui.cat});
  var q=ui.q.trim().toLowerCase();
  if(q)a=a.filter(function(p){return (p.name+' '+(p.desc||'')+' '+(p.category||'')).toLowerCase().indexOf(q)>-1});
  if(ui.sort==='asc')a.sort(function(x,y){return x.price-y.price});
  if(ui.sort==='desc')a.sort(function(x,y){return y.price-x.price});
  return a;
}
function card(p){
  var off=discount(p), out=p.inStock===false;
  return '<article class="card'+(out?' out':'')+'" data-action="open" data-id="'+esc(p.id)+'" tabindex="0" role="button" aria-label="'+esc(p.name)+'">'+
    '<div class="ph"><img src="'+imgSrc(p)+'" alt="'+esc(p.name)+'" loading="lazy">'+
    (out?'<span class="badge out">Épuisé</span>':off?'<span class="badge">-'+off+'%</span>':p.isNew?'<span class="badge new">Nouveau</span>':'')+
    (out?'':'<button class="quick" data-action="add" data-id="'+esc(p.id)+'" aria-label="Ajouter '+esc(p.name)+' au panier">'+ic('plus',20)+'</button>')+
    '</div><div class="meta"><span class="cat">'+esc(p.category||'')+'</span><h3>'+esc(p.name)+'</h3><p class="price"><b>'+money(p.price,S.settings.currency)+'</b>'+(off?'<s>'+money(p.oldPrice,S.settings.currency)+'</s>':'')+'</p></div></article>';

function updateCount(){var c=$('#count');if(!c)return;var n=cart.reduce(function(t,i){return t+i.qty},0);c.textContent=n?String(n):''}
function saveCart(){store.set('aeterna_cart_v1',cart);updateCount()}
function addToCart(id,q){
  var p=find(id);if(!p||p.inStock===false)return;
  var it=cart.filter(function(i){return i.id===id})[0];
  if(it)it.qty=Math.min(99,it.qty+q);else cart.push({id:id,qty:q});
  saveCart();
}

function orderMsg(rows){
  var total=rows.reduce(function(t,r){return t+r.p.price*r.qty},0), c=S.settings.currency;
  var L=['Bonjour AETERNA STORE 👋','Je souhaite commander :'];
  rows.forEach(function(r){L.push('• '+r.qty+' × '+r.p.name+' — '+money(r.p.price*r.qty,c))});

function compress(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();fr.onerror=rej;
    fr.onload=function(){
      var im=new Image();im.onerror=rej;
      im.onload=function(){
        var M=900,w=im.naturalWidth,h=im.naturalHeight,r=Math.min(1,M/Math.max(w,h));
        w=Math.round(w*r);h=Math.round(h*r);
        var c=document.createElement('canvas');c.width=w;c.height=h;
        var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
        res(c.toDataURL('image/jpeg',0.72));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function dataToBlob(u){
  var m=/^data:([^;,]+)(;charset=[^;,]+)?(;base64)?,([\s\S]*)$/.exec(u);if(!m)return null;
  if(!m[3])return new Blob([decodeURIComponent(m[4])],{type:m[1]});
  var bin=atob(m[4]),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
  return new Blob([a],{type:m[1]});
}
function copyText(t){
  var ta=$('#cap');
  function fallback(){if(!ta)return false;ta.focus();ta.select();try{return document.execCommand('copy')}catch(e){return false}}
  if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(t).then(function(){return true},function(){return fallback()})}
  return Promise.resolve(fallback());
}

function saveFile(name,blob){
  var u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(u)},5000);
}

  var t=e.target;
  if(t.id==='sort'){ui.sort=t.value;renderGrid();return}
  if(t.id==='fbsel'){var p=find(t.value,draft);adm.fbId=t.value;adm.caption=p?fbCaption(p):'';renderAdmin();return}
  if(t.id==='file'&&t.files&&t.files.length&&adm.edit){
    var room=MAX_IMG-adm.edit.imgs.length, files=Array.prototype.slice.call(t.files).slice(0,room);
    if(t.files.length>room)toast('Maximum '+MAX_IMG+' photos par produit.');
    Promise.all(files.map(compress)).then(function(list){adm.edit.imgs=adm.edit.imgs.concat(list);renderAdmin()},function(){toast('Une image est illisible. Essayez une autre photo.')});
    t.value='';
  }
});

/* ───────── Démarrage ───────── */
renderShell();renderGrid();
var onClaude=!!(window.claude&&window.claude.use);
function wantsAdmin(){return /^#(proprietaire|admin)$/i.test(location.hash||'')}
function openLocalAdmin(){if(admin||onClaude||!wantsAdmin())return;admin=true;renderShell();renderGrid();openAdmin('products')}
window.addEventListener('hashchange',openLocalAdmin);
openLocalAdmin();
(async function(){
  if(!onClaude)return;
  try{
    var r=await Promise.all([window.claude.use('user').catch(function(){return null}),window.claude.use('artifact').catch(function(){return null}),window.claude.use('downloads').catch(function(){return null})]);
    ART=r[1];DL=r[2];
    if(r[0]){try{admin=!!(await r[0].canEdit())}catch(e){admin=false}}
  }catch(e){}
  if(admin){
    renderShell();renderGrid();
    var after=null;
    try{after=JSON.parse(sessionStorage.getItem('aeterna_after'));sessionStorage.removeItem('aeterna_after')}catch(e){}
    if(after){openAdmin(after.tab||'products');toast('Modifications publiées.')}
  }
})();
})();
</script>
</body>
</html>
