<body>
<header class="hdr adm-hdr"><div class="wrap hdr-in"><a class="logo" href="/" aria-label="Retour à la boutique"><svg width="34" height="17" viewBox="0 0 200 100" fill="none" stroke="currentColor" stroke-width="9" stroke-linejoin="round" aria-hidden="true"><path d="M100 50C130 8 190 8 190 50C190 92 130 92 100 50C70 8 10 8 10 50C10 92 70 92 100 50Z"/></svg><span class="lg-name">AETERNA</span><span class="lg-sub">STORE</span></a><div class="acts"><a class="btn small line" href="/" aria-label="Retour à la boutique">Boutique</a><button class="btn small line" id="btn-out" type="button" hidden>Déconnexion</button></div></div></header>
<main class="wrap adm">
<section id="login-box" class="box narrow" aria-labelledby="h-login"><h1 id="h-login">Espace propriétaire</h1><p>Connexion réservée aux personnes autorisées de la boutique. Utilisez votre compte Google.</p>

<button class="btn" id="btn-google" type="button">Se connecter avec Google</button>

<section id="admin-box" hidden aria-label="Gestion de la boutique"><div class="admin-bar"><div><h1>Espace propriétaire</h1><p class="small" id="who"></p></div></div>
